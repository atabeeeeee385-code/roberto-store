<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin.js | ROBERTO.exe</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--line:#30363d;--txt:#c9d1d9;--muted:#8b949e;--green:#3fb950;--green-bright:#56d364;--blue:#58a6ff;--cyan:#79c0ff;--yellow:#d29922;--orange:#ffa657;--purple:#bc8cff;--pink:#ff7b72;--red:#f85149;--gold:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.6;font-size:14px;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;width:100%;}
.cmt{color:#6e7681;font-style:italic;}
.kw{color:var(--purple);}
.str{color:var(--green);}
.num{color:var(--orange);}
.fn{color:var(--yellow);}
.var{color:var(--cyan);}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);}
.login-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:40px 32px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.login-logo{text-align:center;margin-bottom:8px;}
.login-logo .logo-text{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--gold);}
.login-logo .logo-text::before{content:'~/';color:var(--green);font-weight:400;}
.login-logo .logo-text::after{content:'.exe';color:var(--muted);font-weight:400;font-size:14px;}
.login-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:28px;}
.login-sub::before{content:'// ';color:#6e7681;font-style:italic;}
.login-box .field{margin-bottom:16px;}
.login-box label{display:block;font-size:11px;color:var(--cyan);margin-bottom:6px;font-weight:600;}
.login-box label::before{content:'// ';color:#6e7681;font-style:italic;font-weight:400;}
.login-box input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:var(--txt);font-size:13px;transition:.2s;}
.login-box input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(63,185,80,.15);}
.login-btn{width:100%;background:var(--green);color:var(--bg);padding:13px;border-radius:6px;font-weight:800;font-size:13px;transition:.2s;margin-top:8px;}
.login-btn:hover{background:var(--green-bright);box-shadow:0 0 20px rgba(63,185,80,.4);}
.login-btn::before{content:'$ ';opacity:.7;}
.login-hint{text-align:center;color:var(--muted);font-size:11px;margin-top:16px;}
.login-hint strong{color:var(--gold);}

/* ============ DASHBOARD ============ */
.dash{display:none;max-width:1280px;margin:auto;padding:20px;}
.dash.show{display:block;}

.top-bar{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.top-logo{display:flex;align-items:center;gap:12px;}
.top-logo .mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));display:grid;place-items:center;font-weight:900;color:var(--bg);font-size:20px;}
.top-logo h1{font-size:18px;font-weight:800;color:var(--gold);letter-spacing:2px;}
.top-logo h1::before{content:'~/';color:var(--green);font-weight:400;}
.top-logo h1::after{content:'.admin';color:var(--muted);font-weight:400;font-size:13px;}
.top-logo p{font-size:11px;color:var(--muted);}
.top-logo p::before{content:'// ';color:#6e7681;font-style:italic;}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{padding:10px 16px;border-radius:6px;font-weight:700;font-size:12px;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.btn-primary{background:var(--green);color:var(--bg);}
.btn-primary:hover{background:var(--green-bright);box-shadow:0 0 18px rgba(63,185,80,.4);}
.btn-primary::before{content:'$ ';opacity:.6;}
.btn-ghost{background:var(--bg2);color:var(--txt);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-red{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3);}
.btn-red:hover{background:var(--red);color:#fff;}
.btn-green{background:#25d366;color:#fff;}
.btn-green:hover{background:#1ebe5b;}
.btn-blue{background:var(--blue);color:var(--bg);}
.btn-blue:hover{background:var(--cyan);}

/* Tabs */
.main-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;background:var(--bg2);padding:6px;border-radius:10px;border:1px solid var(--line);width:fit-content;}
.main-tab{padding:10px 20px;border-radius:6px;font-weight:700;font-size:12.5px;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:6px;}
.main-tab:hover{color:var(--txt);background:var(--bg3);}
.main-tab.active{background:var(--green);color:var(--bg);}
.main-tab .badge-count{background:var(--red);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:800;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;transition:.2s;}
.stat:hover{border-color:var(--green);transform:translateY(-2px);}
.stat .num{font-size:26px;font-weight:800;color:var(--gold);display:block;font-family:'JetBrains Mono',monospace;}
.stat .num::before{content:'// ';color:#6e7681;font-size:12px;font-weight:400;font-style:italic;}
.stat .lbl{color:var(--muted);font-size:11px;margin-top:4px;}

/* Layout */
.layout{display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start;}
.layout.full{grid-template-columns:1fr;}
@media(max-width:960px){.layout{grid-template-columns:1fr;}}

.panel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px;}
.panel h3{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.panel h3::before{content:'function ';color:var(--purple);font-weight:400;font-size:14px;}
.panel h3::after{content:'()';color:var(--pink);font-weight:400;font-size:14px;}

/* Form fields */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--cyan);margin-bottom:6px;font-weight:600;}
.field label::before{content:'// ';color:#6e7681;font-style:italic;font-weight:400;}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 14px;color:var(--txt);font-size:12.5px;transition:.2s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(63,185,80,.15);}
.field textarea{resize:vertical;min-height:80px;}
.field select{cursor:pointer;}
.field select option{background:var(--bg2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:500px){.field-row{grid-template-columns:1fr;}}

/* Image upload */
.upload-box{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02);position:relative;}
.upload-box:hover{border-color:var(--green);background:rgba(63,185,80,.05);}
.upload-box.dragover{border-color:var(--green);background:rgba(63,185,80,.1);}
.upload-box input{display:none;}
.upload-box .icon{font-size:36px;margin-bottom:8px;opacity:.7;}
.upload-box .txt{font-size:12.5px;font-weight:700;color:var(--txt);}
.upload-box .txt::before{content:'> ';color:var(--green);}
.upload-box .hint{font-size:10.5px;color:var(--muted);margin-top:4px;}
.upload-box .hint::before{content:'// ';font-style:italic;}
.preview-img{width:100%;max-height:200px;object-fit:contain;border-radius:8px;display:none;margin-bottom:12px;border:1px solid var(--line);background:var(--bg);padding:8px;}
.preview-img.show{display:block;}

/* Product list */
.search-admin{margin-bottom:12px;}
.product-list{max-height:640px;overflow-y:auto;padding-left:4px;}
.product-list::-webkit-scrollbar{width:6px;}
.product-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.prod-item{display:flex;gap:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;align-items:center;transition:.2s;}
.prod-item:hover{border-color:var(--green);}
.prod-item img,.prod-item .placeholder{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--bg3);display:grid;place-items:center;font-size:22px;flex-shrink:0;}
.prod-item .info{flex:1;min-width:0;}
.prod-item h4{font-size:12.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
.prod-item .meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;}
.prod-item .meta .price{color:var(--gold);font-weight:700;}
.prod-item .acts{display:flex;gap:5px;flex-shrink:0;}
.prod-item .acts button{width:32px;height:32px;border-radius:6px;font-size:13px;display:grid;place-items:center;transition:.2s;}
.edit-btn{background:rgba(210,153,34,.15);color:var(--yellow);border:1px solid rgba(210,153,34,.3);}
.edit-btn:hover{background:var(--yellow);color:var(--bg);}
.del-btn{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3);}
.del-btn:hover{background:var(--red);color:#fff;}

/* Orders */
.orders-list{display:flex;flex-direction:column;gap:14px;}
.order-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px;transition:.2s;}
.order-card:hover{border-color:var(--green);}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.order-id{font-family:monospace;color:var(--gold);font-weight:800;font-size:15px;}
.order-date{color:var(--muted);font-size:11px;}
.order-status{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:800;}
.status-new{background:rgba(63,185,80,.15);color:var(--green);}
.status-confirmed{background:rgba(88,166,255,.15);color:var(--blue);}
.status-shipped{background:rgba(210,153,34,.15);color:var(--yellow);}
.status-delivered{background:rgba(188,140,255,.15);color:var(--purple);}

.customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;font-size:12px;}
@media(max-width:600px){.customer-grid{grid-template-columns:1fr;}}
.customer-grid .item-line{display:flex;gap:6px;}
.customer-grid .item-line .key{color:var(--cyan);font-weight:600;flex-shrink:0;}
.customer-grid .item-line .key::after{content:':';color:var(--muted);}

.order-items{background:var(--bg2);border-radius:8px;padding:12px;margin-bottom:12px;}
.order-items .items-title{font-size:11px;color:var(--muted);margin-bottom:8px;}
.order-items .items-title::before{content:'// ';font-style:italic;}
.order-items .order-item-line{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;}
.order-items .order-item-line .qty{color:var(--cyan);}
.order-items .order-item-line .price{color:var(--orange);}
.order-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:800;color:var(--gold);font-size:14px;}
.order-total::before{content:'';}
.order-notes{background:rgba(255,255,255,.03);border-radius:6px;padding:10px;margin-bottom:12px;font-size:11.5px;color:var(--muted);border-right:3px solid var(--yellow);}
.order-notes::before{content:'// ملاحظات: ';color:var(--yellow);font-weight:700;}

.order-actions{display:flex;gap:6px;flex-wrap:wrap;}

.empty-orders{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-orders .icon{font-size:56px;margin-bottom:16px;}
.empty-orders h4{font-size:15px;color:var(--txt);margin-bottom:8px;font-weight:700;}
.empty-orders p{font-size:12px;color:#6e7681;}

/* Empty list */
.empty-list{text-align:center;padding:40px 20px;color:var(--muted);font-size:12.5px;}
.empty-list::before{content:'// ';color:#6e7681;font-style:italic;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--bg2);border:1px solid var(--green);padding:14px 24px;border-radius:10px;font-weight:700;font-size:12.5px;z-index:9999;opacity:0;transition:.4s;box-shadow:0 20px 50px rgba(0,0,0,.6);color:var(--green);}
.toast.show{transform:translate(-50%,0);opacity:1;}
.toast::before{content:'✓ ';font-weight:800;}
.toast.error{border-color:var(--red);color:var(--red);}
.toast.error::before{content:'✗ ';}

/* Responsive */
@media(max-width:600px){
  .dash{padding:12px;}
  .top-bar{padding:12px;}
  .top-logo h1{font-size:15px;}
  .top-actions{gap:6px;}
  .btn{padding:8px 12px;font-size:11px;}
  .panel{padding:16px;}
  .main-tabs{width:100%;justify-content:space-around;}
  .main-tab{padding:8px 12px;font-size:11.5px;flex:1;justify-content:center;}
}
::selection{background:var(--green);color:var(--bg);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo"><span class="logo-text">roberto</span></div>
    <p class="login-sub">لوحة تحكم الأدمن</p>
    <div class="field">
      <label>كلمة السر</label>
      <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="login-btn" onclick="login()">login()</button>
    <p class="login-hint">كلمة السر الافتراضية: <strong>roberto2026</strong></p>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="dash" id="dash">

  <div class="top-bar">
    <div class="top-logo">
      <div class="mark">R</div>
      <div>
        <h1>roberto</h1>
        <p>Admin Dashboard</p>
      </div>
    </div>
    <div class="top-actions">
      <a href="index.html" target="_blank" class="btn btn-ghost">👁 المتجر</a>
      <button class="btn btn-ghost" onclick="exportData()">⬇ تصدير</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ استيراد</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-red" onclick="logout()">🚪 خروج</button>
    </div>
  </div>

  <!-- MAIN TABS -->
  <div class="main-tabs">
    <button class="main-tab active" id="tab-products" onclick="switchTab('products')">📦 المنتجات</button>
    <button class="main-tab" id="tab-orders" onclick="switchTab('orders')">
      🛒 الطلبات <span class="badge-count" id="ordersBadge" style="display:none">0</span>
    </button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><span class="num" id="s-total">0</span><div class="lbl">إجمالي المنتجات</div></div>
    <div class="stat"><span class="num" id="s-keyboard">0</span><div class="lbl">كيبوردات</div></div>
    <div class="stat"><span class="num" id="s-mouse">0</span><div class="lbl">ماوس</div></div>
    <div class="stat"><span class="num" id="s-other">0</span><div class="lbl">حوامل وسماعات</div></div>
  </div>

  <!-- ============ PRODUCTS TAB ============ -->
  <div id="productsTab">
    <div class="layout">

      <!-- FORM -->
      <div>
        <div class="panel">
          <h3 id="form-title">إضافة منتج جديد</h3>

          <div class="field">
            <label>صورة المنتج</label>
            <div class="upload-box" id="uploadBox">
              <input type="file" id="imgInput" accept="image/*">
              <div class="icon">📷</div>
              <div class="txt">اضغط لاختيار صورة</div>
              <div class="hint">PNG, JPG, WEBP — حتى 2MB</div>
            </div>
            <img id="preview" class="preview-img" alt="">
            <button class="btn btn-red" id="removeImg" style="display:none;margin-top:8px;width:100%;justify-content:center" onclick="clearImage()">🗑 إزالة الصورة</button>
          </div>

          <div class="field">
            <label>اسم المنتج</label>
            <input type="text" id="f-name" placeholder="مثال: كيبورد Redragon K552">
          </div>

          <div class="field">
            <label>التصنيف</label>
            <select id="f-cat">
              <option value="keyboard">كيبوردات</option>
              <option value="mouse">ماوس</option>
              <option value="stand">حوامل</option>
              <option value="headset">سماعات</option>
            </select>
          </div>

          <div class="field-row">
            <div class="field">
              <label>السعر الحالي (ج.م)</label>
              <input type="number" id="f-price" placeholder="1450" min="0">
            </div>
            <div class="field">
              <label>السعر قبل الخصم</label>
              <input type="number" id="f-old" placeholder="1700" min="0">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>المخزون</label>
              <input type="number" id="f-stock" placeholder="10" min="0" value="10">
            </div>
            <div class="field">
              <label>الأكثر مبيعاً؟</label>
              <select id="f-best">
                <option value="false">لا</option>
                <option value="true">نعم 🔥</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>وصف المنتج</label>
            <textarea id="f-desc" rows="3" placeholder="اكتب وصف مختصر وجذاب..."></textarea>
          </div>

          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveProduct()" id="saveBtn">💾 حفظ المنتج</button>
            <button class="btn btn-ghost" id="cancelBtn" style="display:none" onclick="resetForm()">✗ إلغاء</button>
          </div>
        </div>
      </div>

      <!-- LIST -->
      <div class="panel">
        <h3>المنتجات الحالية</h3>
        <input type="text" class="search-admin" id="admin-search" placeholder="🔍 ابحث..." oninput="renderList()">
        <div class="product-list" id="productList"></div>
      </div>

    </div>
  </div>

  <!-- ============ ORDERS TAB ============ -->
  <div id="ordersTab" style="display:none">
    <div class="panel">
      <h3>الطلبات الواردة</h3>
      <div class="orders-list" id="ordersList"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"><span id="toast-text"></span></div>

<script>
// ==================== CONFIG ====================
const ADMIN_PASS = "roberto2026";
const STORAGE_KEY = "roberto_products";
const ORDERS_KEY = "roberto_orders";

// ==================== STATE ====================
let products = [];
let orders = [];
let editingId = null;
let currentImage = null;
let currentTab = 'products';

const $ = id => document.getElementById(id);

// ==================== LOGIN ====================
function login(){
  const val = $('pass').value;
  if(val === ADMIN_PASS){
    sessionStorage.setItem('roberto_auth', '1');
    showDash();
  } else {
    toast("كلمة السر غلط", true);
  }
}
function logout(){
  sessionStorage.removeItem('roberto_auth');
  location.reload();
}
function showDash(){
  $('loginWrap').style.display = 'none';
  $('dash').classList.add('show');
  loadProducts();
  loadOrders();
  renderList();
  updateStats();
  updateOrdersBadge();
}

// ==================== STORAGE ====================
function loadProducts(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try { products = JSON.parse(raw); } catch(e){ products = []; }
  } else {
    products = [
      { id:1, name:"كيبورد ميكانيكال Redragon K552", cat:"keyboard", price:1450, old:1700, stock:3, reviews:127, rating:5, best:true, desc:"كيبورد ميكانيكال بمفاتيح حمراء وإضاءة RGB", img:null },
      { id:2, name:"ماوس لاسلكي Logitech M170", cat:"mouse", price:380, old:450, stock:12, reviews:203, rating:5, best:true, desc:"ماوس لاسلكي موثوق وبطارية 12 شهر", img:null }
    ];
    saveProducts();
  }
}
function saveProducts(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function loadOrders(){
  const raw = localStorage.getItem(ORDERS_KEY);
  if(raw){
    try { orders = JSON.parse(raw); } catch(e){ orders = []; }
  } else {
    orders = [];
  }
}

// ==================== IMAGE UPLOAD ====================
const uploadBox = $('uploadBox');
const imgInput = $('imgInput');

uploadBox.onclick = () => imgInput.click();
imgInput.onchange = e => handleFile(e.target.files[0]);

['dragenter','dragover'].forEach(ev => {
  uploadBox.addEventListener(ev, e => {
    e.preventDefault();
    uploadBox.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(ev => {
  uploadBox.addEventListener(ev, e => {
    e.preventDefault();
    uploadBox.classList.remove('dragover');
  });
});
uploadBox.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if(file) handleFile(file);
});

function handleFile(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast("الملف مش صورة", true); return; }
  if(file.size > 2*1024*1024){ toast("الصورة أكبر من 2MB", true); return; }

  const reader = new FileReader();
  reader.onload = e => {
    compressImage(e.target.result, 800, 0.8, dataUrl => {
      currentImage = dataUrl;
      showPreview(dataUrl);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(src, maxSize, quality, cb){
  const img = new Image();
  img.onload = () => {
    let {width, height} = img;
    if(width > height && width > maxSize){
      height = Math.round(height * maxSize / width);
      width = maxSize;
    } else if(height > maxSize){
      width = Math.round(width * maxSize / height);
      height = maxSize;
    }
    const cvs = document.createElement('canvas');
    cvs.width = width;
    cvs.height = height;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    cb(cvs.toDataURL('image/jpeg', quality));
  };
  img.src = src;
}

function showPreview(src){
  $('preview').src = src;
  $('preview').classList.add('show');
  $('removeImg').style.display = 'block';
  uploadBox.style.display = 'none';
}
function clearImage(){
  currentImage = null;
  $('preview').classList.remove('show');
  $('removeImg').style.display = 'none';
  uploadBox.style.display = 'block';
  imgInput.value = '';
}

// ==================== SAVE PRODUCT ====================
function saveProduct(){
  const name = $('f-name').value.trim();
  const price = parseFloat($('f-price').value);
  const old = parseFloat($('f-old').value) || 0;
  const stock = parseInt($('f-stock').value) || 10;
  const best = $('f-best').value === 'true';

  if(!name){ toast("اكتب اسم المنتج", true); return; }
  if(!price || price <= 0){ toast("اكتب سعر صحيح", true); return; }

  const data = {
    name,
    cat: $('f-cat').value,
    price,
    old,
    stock,
    best,
    desc: $('f-desc').value.trim(),
    img: currentImage,
    reviews: 50,
    rating: 5
  };

  if(editingId){
    const idx = products.findIndex(p => p.id === editingId);
    products[idx] = { ...products[idx], ...data };
    toast("تم تحديث المنتج ✓");
  } else {
    products.push({ id: Date.now(), ...data });
    toast("تم إضافة المنتج ✓");
  }

  saveProducts();
  resetForm();
  renderList();
  updateStats();
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  $('f-name').value = p.name;
  $('f-cat').value = p.cat;
  $('f-price').value = p.price;
  $('f-old').value = p.old || '';
  $('f-stock').value = p.stock || 10;
  $('f-best').value = p.best ? 'true' : 'false';
  $('f-desc').value = p.desc || '';
  $('form-title').textContent = "تعديل المنتج";
  $('saveBtn').textContent = "💾 حفظ التعديلات";
  $('cancelBtn').style.display = 'block';

  if(p.img){
    currentImage = p.img;
    showPreview(p.img);
  } else {
    clearImage();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteProduct(id){
  if(!confirm("متأكد إنك عايز تحذف المنتج؟")) return;
  products = products.filter(x => x.id !== id);
  saveProducts();
  renderList();
  updateStats();
  toast("تم حذف المنتج");
}

function resetForm(){
  editingId = null;
  $('f-name').value = '';
  $('f-cat').value = 'keyboard';
  $('f-price').value = '';
  $('f-old').value = '';
  $('f-stock').value = '10';
  $('f-best').value = 'false';
  $('f-desc').value = '';
  $('form-title').textContent = "إضافة منتج جديد";
  $('saveBtn').textContent = "💾 حفظ المنتج";
  $('cancelBtn').style.display = 'none';
  clearImage();
}

// ==================== RENDER LIST ====================
function renderList(){
  const q = $('admin-search').value.trim();
  const list = products.filter(p => p.name.includes(q));
  const box = $('productList');

  if(list.length === 0){
    box.innerHTML = `<div class="empty-list">لا توجد منتجات بعد</div>`;
    return;
  }

  const catName = c => ({keyboard:"كيبورد", mouse:"ماوس", stand:"حامل", headset:"سماعة"}[c] || c);

  box.innerHTML = list.map(p => `
    <div class="prod-item">
      ${p.img 
        ? `<img src="${p.img}" alt="${p.name}">` 
        : `<div class="placeholder">📦</div>`}
      <div class="info">
        <h4>${p.name}</h4>
        <div class="meta">
          <span>${catName(p.cat)}</span>
          <span class="price">${p.price} ج.م</span>
          <span>مخزون: ${p.stock || 0}</span>
        </div>
      </div>
      <div class="acts">
        <button class="edit-btn" onclick="editProduct(${p.id})" title="تعديل">✏️</button>
        <button class="del-btn" onclick="deleteProduct(${p.id})" title="حذف">🗑</button>
      </div>
    </div>
  `).join("");
}

function updateStats(){
  $('s-total').textContent = products.length;
  $('s-keyboard').textContent = products.filter(p => p.cat === 'keyboard').length;
  $('s-mouse').textContent = products.filter(p => p.cat === 'mouse').length;
  $('s-other').textContent = products.filter(p => p.cat === 'stand' || p.cat === 'headset').length;
}

// ==================== TABS ====================
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));

  if(tab === 'products'){
    $('tab-products').classList.add('active');
    $('productsTab').style.display = 'block';
    $('ordersTab').style.display = 'none';
  } else {
    $('tab-orders').classList.add('active');
    $('productsTab').style.display = 'none';
    $('ordersTab').style.display = 'block';
    renderOrders();
  }
}

// ==================== ORDERS ====================
function updateOrdersBadge(){
  const badge = $('ordersBadge');
  const newOrders = orders.filter(o => o.status === 'جديد').length;
  if(newOrders > 0){
    badge.textContent = newOrders;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function renderOrders(){
  const list = $('ordersList');
  updateOrdersBadge();

  if(orders.length === 0){
    list.innerHTML = `
      <div class="empty-orders">
        <div class="icon">📭</div>
        <h4>لا توجد طلبات بعد</h4>
        <p>// الطلبات هتظهر هنا لما العملاء يطلبو من الموقع</p>
      </div>
    `;
    return;
  }

  list.innerHTML = orders.map(o => {
    const statusClass = {
      'جديد': 'status-new',
      'تم التأكيد': 'status-confirmed',
      'تم الشحن': 'status-shipped',
      'تم التوصيل': 'status-delivered'
    }[o.status] || 'status-new';

    const phoneClean = o.customer.phone.replace(/^0/, '');
    const waMsg = encodeURIComponent(`مرحباً ${o.customer.name} 👋\n\nبخصوص طلبك رقم ${o.id}\nالإجمالي: ${o.total.toLocaleString('ar-EG')} ج.م\n\nشكراً لثقتك في ROBERTO!`);

    return `
      <div class="order-card">
        <div class="order-head">
          <div class="order-id">#${o.id}</div>
          <div class="order-date">${new Date(o.date).toLocaleString('ar-EG')}</div>
          <div class="order-status ${statusClass}">${o.status}</div>
        </div>

        <div class="customer-grid">
          <div class="item-line"><span class="key">الاسم</span><span>${o.customer.name}</span></div>
          <div class="item-line"><span class="key">الموبايل</span><a href="tel:${o.customer.phone}" style="color:var(--green)">${o.customer.phone}</a></div>
          <div class="item-line"><span class="key">المحافظة</span><span>${o.customer.gov}</span></div>
          <div class="item-line"><span class="key">المدينة</span><span>${o.customer.city}</span></div>
          <div class="item-line" style="grid-column:1/-1"><span class="key">العنوان</span><span>${o.customer.address}</span></div>
          <div class="item-line"><span class="key">الدفع</span><span>${o.payment}</span></div>
          <div class="item-line"><span class="key">الشحن</span><span>${o.shipping === 0 ? 'مجاني ✓' : o.shipping + ' ج.م'}</span></div>
        </div>

        <div class="order-items">
          <div class="items-title">المنتجات</div>
          ${o.items.map(i => `
            <div class="order-item-line">
              <span>${i.name} <span class="qty">× ${i.qty}</span></span>
              <span class="price">${(i.price * i.qty).toLocaleString('ar-EG')} ج.م</span>
            </div>
          `).join("")}
          <div class="order-total">
            <span>الإجمالي</span>
            <span>${o.total.toLocaleString('ar-EG')} ج.م</span>
          </div>
        </div>

        ${o.notes ? `<div class="order-notes">${o.notes}</div>` : ""}

        <div class="order-actions">
          <a href="https://wa.me/2${phoneClean}?text=${waMsg}" target="_blank" class="btn btn-green">💬 واتساب العميل</a>
          <button class="btn btn-blue" onclick="updateOrderStatus('${o.id}','تم التأكيد')">✓ تأكيد</button>
          <button class="btn btn-ghost" onclick="updateOrderStatus('${o.id}','تم الشحن')">🚚 شحن</button>
          <button class="btn btn-ghost" onclick="updateOrderStatus('${o.id}','تم التوصيل')">✅ توصيل</button>
          <button class="btn btn-red" onclick="deleteOrder('${o.id}')">🗑 حذف</button>
        </div>
      </div>
    `;
  }).join("");
}

function updateOrderStatus(id, status){
  const o = orders.find(x => x.id === id);
  if(!o) return;
  o.status = status;
  localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
  renderOrders();
  toast(`تم تحديث الحالة: ${status}`);
}

function deleteOrder(id){
  if(!confirm("متأكد إنك عايز تحذف الطلب؟")) return;
  orders = orders.filter(x => x.id !== id);
  localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
  renderOrders();
  toast("تم حذف الطلب");
}

// ==================== EXPORT / IMPORT ====================
function exportData(){
  const data = {
    products: products,
    orders: orders,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `roberto-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("تم تصدير البيانات ✓");
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      
      // دعم الصيغة القديمة (مصفوفة) والجديدة (كائن)
      let newProducts, newOrders;
      if(Array.isArray(data)){
        newProducts = data;
        newOrders = orders;
      } else {
        newProducts = data.products || [];
        newOrders = data.orders || [];
      }

      if(!confirm(`سيتم استبدال ${products.length} منتج و ${orders.length} طلب. متأكد؟`)) return;

      products = newProducts;
      orders = newOrders;
      saveProducts();
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));

      renderList();
      updateStats();
      if(currentTab === 'orders') renderOrders();
      updateOrdersBadge();
      toast("تم استيراد البيانات ✓");
    } catch {
      toast("الملف غير صالح", true);
    }
  };
  reader.readAsText(file);
}

// ==================== TOAST ====================
function toast(msg, isError){
  const t = $('toast');
  $('toast-text').textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2400);
}

// ==================== INIT ====================
if(sessionStorage.getItem('roberto_auth') === '1'){
  showDash();
}

// تحديث الطلبات تلقائياً لو حصل طلب جديد في تاب تاني
window.addEventListener('storage', e => {
  if(e.key === ORDERS_KEY){
    loadOrders();
    if(currentTab === 'orders') renderOrders();
    updateOrdersBadge();
  }
  if(e.key === STORAGE_KEY){
    loadProducts();
    renderList();
    updateStats();
  }
});
</script>
