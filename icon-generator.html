<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ROBERTO Icon Generator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace;}
  body{background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:24px;}
  h1{font-size:28px;letter-spacing:8px;font-weight:900;color:#d4af37;}
  h1::before{content:'~/';color:#3fb950;font-weight:400;}
  h1::after{content:'.exe';color:#8b949e;font-weight:400;font-size:14px;}
  p{color:#8b949e;font-size:13px;}
  p::before{content:'// ';font-style:italic;}
  .previews{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;}
  .preview-box{display:flex;flex-direction:column;align-items:center;gap:12px;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px;}
  .preview-box canvas{border-radius:20px;box-shadow:0 20px 50px rgba(63,185,80,.2);}
  .preview-box span{font-size:11px;color:#3fb950;font-weight:800;letter-spacing:1px;}
  .btn{background:#3fb950;color:#0d1117;padding:16px 40px;border-radius:8px;font-weight:900;font-size:14px;letter-spacing:1px;border:none;cursor:pointer;transition:.3s;font-family:inherit;}
  .btn:hover{background:#56d364;box-shadow:0 12px 30px rgba(63,185,80,.4);transform:translateY(-2px);}
  .btn::before{content:'$ ';opacity:.6;}
  .note{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.25);border-radius:10px;padding:14px 20px;max-width:600px;text-align:center;font-size:12px;line-height:1.8;color:#3fb950;}
</style>
</head>
<body>

<h1>roberto</h1>
<p>مولّد الأيقونات — اضغط الزر ونزّل الاتنين</p>

<div class="previews">
  <div class="preview-box">
    <canvas id="c192" width="192" height="192"></canvas>
    <span>icon-192.png</span>
  </div>
  <div class="preview-box">
    <canvas id="c512" width="512" height="512" style="width:220px;height:220px"></canvas>
    <span>icon-512.png</span>
  </div>
</div>

<button class="btn" onclick="downloadAll()">حمّل الأيقونات</button>

<div class="note">
  💡 هيتنزلك ملفين في Downloads<br>
  انقلهم لفولدر <b>icons</b> — شيل <b>.png.png</b> لو موجود
</div>

<script>
function drawIcon(canvas){
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const s = size / 512;
  const cx = size / 2;
  const cy = size / 2;

  // خلفية داكنة
  const bg = ctx.createLinearGradient(0, 0, size, size);
  bg.addColorStop(0, '#0d1117');
  bg.addColorStop(1, '#161b22');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);

  // إطار أخضر خارجي
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 10 * s;
  ctx.strokeRect(20 * s, 20 * s, size - 40 * s, size - 40 * s);

  // إطار أخضر داخلي رفيع
  ctx.strokeStyle = 'rgba(63,185,80,.35)';
  ctx.lineWidth = 2 * s;
  ctx.strokeRect(40 * s, 40 * s, size - 80 * s, size - 80 * s);

  // حرف R كبير في المنتصف
  ctx.font = `900 ${280 * s}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ظل
  ctx.fillStyle = 'rgba(63,185,80,.3)';
  ctx.fillText('R', cx + 4 * s, cy - 30 * s + 4 * s);

  // الحرف بتدرج
  const txtGrad = ctx.createLinearGradient(0, cy - 150 * s, 0, cy + 100 * s);
  txtGrad.addColorStop(0, '#56d364');
  txtGrad.addColorStop(0.5, '#3fb950');
  txtGrad.addColorStop(1, '#d4af37');
  ctx.fillStyle = txtGrad;
  ctx.fillText('R', cx, cy - 30 * s);

  // مؤشر _ تحت الحرف
  ctx.font = `700 ${60 * s}px 'JetBrains Mono', monospace`;
  ctx.fillStyle = '#3fb950';
  ctx.fillText('>_', cx, cy + 140 * s);

  // اسم ROBERTO تحت
  ctx.font = `800 ${42 * s}px 'JetBrains Mono', monospace`;
  ctx.fillStyle = '#d4af37';
  ctx.textBaseline = 'middle';
  ctx.fillText('ROBERTO', cx, size - 60 * s);
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

function downloadAll(){
  const sizes = [
    { id: 'c192', name: 'icon-192.png' },
    { id: 'c512', name: 'icon-512.png' }
  ];

  sizes.forEach((item, i) => {
    setTimeout(() => {
      const canvas = document.getElementById(item.id);
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = item.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png', 1);
    }, i * 500);
  });
}
</script>
</body>
</html>
